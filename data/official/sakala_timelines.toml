# Statutory service timelines under the Karnataka Sakala Services Act, 2011.
# Source: the official Sakala Service Compendium (English, dated 05-05-2026), linked from
# https://sakala.kar.nic.in/index.aspx. `page` is the PDF page number (the printed page
# number is in brackets in each comment). Only the services our office types handle are copied.
#
# days: the time the designated officer has to dispose of an application, in working days
# unless `unit` says otherwise.
# If it isn't met, the citizen can file a first appeal with the competent officer, then a
# second appeal with the appellate authority (35 working days each for every service below).

[meta]
source_url = "https://sakala.kar.nic.in/Service%20Compendium/05-05-2026%20sakala_service_compendium_English%20(Final).pdf"
source_name = "Sakala Service Compendium (English), 05-05-2026"
portal_url = "https://sakala.kar.nic.in/index.aspx"
fetched = 2026-10-08
act = "Karnataka Sakala Services Act, 2011"

[appeals.rto]
designated_officer = "Deputy Commissioner for Transport / Senior RTO / RTO / ARTO"
first_appeal = "Joint Commissioner for Transport"
first_appeal_days = 35
second_appeal = "Commissioner for Transport"  # "Commissioner for Transport and Road Safety" in S.No. 25-26
second_appeal_days = 35

[appeals.subregistrar]
designated_officer = "Sub-Registrar"
first_appeal = "District Registrar"
first_appeal_days = 35
second_appeal = "Inspector General of Registration and Commissioner of Stamps"
second_appeal_days = 35


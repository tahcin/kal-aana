# Stamps and Registration Department (section 35.1). PDF pages 311-312 (printed 284-285).

[[service]]
id = "property-registration"
office_type = "subregistrar"
name = "Registration of immovable property"
days = 1
page = 311  # printed 284, S.No. 1

[[service]]
id = "encumbrance-certificate"
office_type = "subregistrar"
name = "Encumbrance certificate (from 01-04-2004, Kaveri period)"

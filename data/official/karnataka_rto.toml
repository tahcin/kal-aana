# Regional Transport Offices serving Bengaluru, as published by the Transport Department,
# Government of Karnataka. Copied from the "Bengaluru Urban Division" table, plus KA-52
# (Nelamangala) from the "Bengaluru Rural Division" table because it serves the city's
# north-west edge. Staff names are deliberately omitted.
#
# landlines: the "PHONE NO." column. cug: the "CUG NO." column (official closed-user-group
# mobiles). Numbers are copied as published; obvious typos are kept in `published_errors`
# rather than silently corrected. A shorthand pair such as "080-23286712/13" is expanded to
# 080-23286712 and 080-23286713.
#
# aliases: added by us, not from the source. Other spellings of the office's area that Google
# Maps listings use, so matching doesn't depend on one transliteration.


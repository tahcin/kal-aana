landlines = ["080-22117711"]
email = "rpo.bangalore@mea.gov.in"
source_url = "https://www.passportindia.gov.in/psp/RPO/RPOPSK"
aliases = ["Lalbagh", "Lal Bagh", "Prestige Libra"]

[[office]]
id = "psk-whitefield"
name = "Passport Seva Kendra, Whitefield"
kind = "PSK"
address = "GM Tech Park, No. 116, Road No. 3, EPIP Zone, Whitefield, Bengaluru 560066"
landlines = ["080-25639137"]
email = "rpo.bangalore@mea.gov.in"
source_url = "https://www.passportindia.gov.in/psp/RPO/RPOPSK"
note = "Replaced PSK Sai Arcade (Marathahalli) from 5 October 2026. Its Google listing has reviews from before then (from 22 September), and they are included in its review sample."
